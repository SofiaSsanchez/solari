const $ = s => document.querySelector(s), byId = id => PRODUCTS.find(p => p.id === id);
const fmt = n => "$" + n.toLocaleString("es-AR");
const save = () => { try { localStorage.setItem("solari_cart", JSON.stringify(cart)); } catch(e){} };
const count = () => Object.values(cart).reduce((a,b)=>a+b,0);
function setQ(id,d){ const p=byId(id), q=(cart[id]||0)+d; if(q<=0) delete cart[id]; else cart[id]=Math.min(q,p.s); save(); draw(); if($("#ov").classList.contains("on")&&step===0) modal(); if($("#pv").classList.contains("on")) renderP(); }
 
let menuOpen=false;
function drawNav(){
  const all=[["inicio","Inicio"],["todo","Todo"],...CATS.map(c=>[c.k,c.t])], nav=$("#nav");
  const cur=(all.find(a=>a[0]===cat)||all[0])[1];
  nav.innerHTML=`<button class="bg" id="bg" aria-expanded="false" aria-controls="links"><span class="ic"></span><span class="cur">${cur}</span><span class="car">▼</span></button>
  <div class="links" id="links">${all.map(([k,t])=>`<button class="chip ${cat===k?"on":""}" data-c="${k}">${t}</button>`).join("")}</div>`;
  $("#links").onclick=e=>{ const c=e.target.dataset.c; if(c){cat=c; menuOpen=false; draw(); scrollTo({top:0});} };
  $("#bg").onclick=()=>{ menuOpen=!menuOpen; fitNav(); };
  fitNav();
}
function fitNav(){
  const nav=$("#nav"), links=$("#links"); if(!nav||!links) return;
  nav.classList.remove("burger","open");
  const cs=getComputedStyle(nav), avail=nav.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const burger=links.scrollWidth>avail+1;
  nav.classList.toggle("burger",burger);
  nav.classList.toggle("open",burger&&menuOpen);
  const b=$("#bg"); if(b) b.setAttribute("aria-expanded",burger&&menuOpen);
}
addEventListener("resize",fitNav);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitNav);
document.addEventListener("click",e=>{ if(menuOpen&&!e.target.closest("#nav")){menuOpen=false;fitNav();} });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&menuOpen){menuOpen=false;fitNav();} });
function card(p){
  const q=cart[p.id]||0, out=p.s<=0;
  return `<div class="card ${out?"out":""}"><img loading="lazy" src="${IMG[p.id]}" alt="${p.n}" onclick="openP('${p.id}')"><div class="b"><h3 onclick="openP('${p.id}')">${p.n}</h3>
  <div class="pr">${PR(p)!=null?fmt(PR(p)):"Consultar precio"}</div>
  <button class="ver" onclick="openP('${p.id}')">Ver detalles ›</button>
  ${out?`<button class="btn" disabled>Agotado</button>`: q?`<div class="qty"><button onclick="setQ('${p.id}',-1)">−</button><span>${q}</span><button onclick="setQ('${p.id}',1)" ${q>=p.s?"disabled":""}>+</button></div>`:`<button class="btn" onclick="setQ('${p.id}',1)">Agregar</button>`}
  </div></div>`;
}
function go(k){ cat=k; menuOpen=false; draw(); scrollTo({top:0}); }
function home(){
  const pagos=PAGOS.map(o=>o.n).join(", ");
  const pasos=[
    ["Elegí tus productos","Entrá al stock, recorré las categorías y tocá <b>Agregar</b> en lo que te guste. Si querés más de uno, sumá con + y −."],
    ["Revisá tu carrito","Tocá <b>Mi carrito</b> (abajo a la derecha) para ver lo que elegiste, cambiar cantidades y ver el total."],
   /* ["Elegí cómo pagar",`Podés pagar con ${pagos}.`+(DESC_EFECTIVO>0?` <b>Pagando en efectivo tenés ${DESC_EFECTIVO}% de descuento.</b>`:"")],*/
    ["Elegí cómo recibirlo",`Envío a domicilio o entrega en un punto de encuentro en La Plata (abajo están todos).`+(ENVIO_NOTA?` <b>El envío no está incluido en el precio. Una vez finalizada la compra, se coordina por Whatsapp dependiendo el costo dado por Correo Argentino.</b>`:"")],
    ["Enviá tu pedido por WhatsApp","Se abre WhatsApp con tu pedido ya escrito, solo tenés que enviarlo. Ahí podés aclararme lo que quieras (por ejemplo, un detalle extra) y yo te confirmo la disponibilidad y coordinamos el pago y la entrega."]
  ];

  /* ${DESC_EFECTIVO>0?`<div class="promo">✦ ${DESC_EFECTIVO}% OFF pagando en efectivo ✦</div><br>`:""} */

  if(SENA_PCT>0) pasos.push([`Señá el ${SENA_PCT}% para reservar`,`La seña es obligatoria: es la que reserva tus productos. Cuando te confirme el stock, coordinamos cómo abonarla.`]);
  const tiles=CATS.map(c=>{const f=PRODUCTS.find(p=>p.cat===c.k&&!p.off); return f?`<button class="tile" onclick="go('${c.k}')"><img src="${IMG[f.id]}" alt=""><span>${c.t}</span></button>`:"";}).join("");
  return `<section class="hero"><div class="sunwrap"><img src="${D.logo}" alt="Solari Gothic Jewelry"></div><h2 class="serif">Te doy la bienvenida</h2>
    <p>Acá vas a encontrar todo mi stock disponible: chockers, cadenitas, collares, aros, pulseras, llaveros y anillos. Armá tu carrito y terminamos la compra por WhatsApp.</p>
    ${SENA_PCT>0?`<div class="sena home"><b>Seña obligatoria del ${SENA_PCT}%</b><span>Para reservar tu pedido se abona una seña del ${SENA_PCT}% del total.</span></div>`:""}
    ${ENVIO_NOTA?`<div class="envnote">✦ El envío no está incluido en el precio ✦</div>`:""}
    <button class="btn cta" onclick="go('todo')">Ver el stock</button></section>
    <div class="tiles">${tiles}</div>
    <img class="flor" src="${D.flor}" alt=""><div class="h3" style="margin-top:22px">¿Cómo comprar?</div><p class="sub">Es muy simple, en ${pasos.length} pasos</p>
    <div class="pasos">${pasos.map((p,i)=>`<div class="paso"><div class="n">${i+1}</div><div><h4>${p[0]}</h4><p>${p[1]}</p></div></div>`).join("")}</div>
    ${PUNTOS.length?`<img class="flor" src="${D.flor}" alt="" style="margin-top:40px"><div class="h3" id="puntos" style="margin-top:22px">Puntos de entrega en La Plata</div><p class="sub">Si elegís retirar, estos son los lugares donde entrego</p>
    <div class="puntos">${PUNTOS.map(p=>`<div class="punto"><h4>${p.n}</h4><p>${p.d}</p>${p.h?`<p class="h">${p.h}</p>`:""}</div>`).join("")}</div>`:""}
    <p class="fin">Tu compra se finaliza por WhatsApp: ahí te confirmo el stock y coordinamos el pago y la entrega.</p>
    <div style="text-align:center;margin-top:22px"><button class="btn cta" onclick="go('todo')">Empezar a elegir</button></div>`;
}
function draw(){
  document.body.classList.toggle("home",cat==="inicio");
  drawNav();
  if(cat==="inicio"){ $("#main").innerHTML=home(); $("#cnt").textContent=count(); fx(); return; }
  const list = CATS.filter(c=>cat==="todo"||c.k===cat);
  $("#main").innerHTML = list.map(c=>{
    const ps=PRODUCTS.filter(p=>p.cat===c.k&&!p.off); if(!ps.length) return "";
    return `<div class="sec"><h2>${c.t}</h2><span>${c.d}</span><img class="flor" src="${D.flor}" alt=""></div><div class="grid">${ps.map(card).join("")}</div>`;
  }).join("");
  $("#cnt").textContent = count();
  fx();
}
const SENA_PCT = (typeof SENA!=="undefined") ? SENA : 25;   // % de seña (se cambia en productos.js)
const ENVIO_NOTA = (typeof ENVIO_CLIENTE!=="undefined") ? ENVIO_CLIENTE : "El envío no está incluido en el precio.";   // se cambia en productos.js
const PR = p => (p.p ?? PRECIO_CAT[p.cat] ?? null);
function calc(){
  let sub=0, sin=0;
  for(const id in cart){ const p=byId(id), pr=PR(p); if(pr==null) sin+=cart[id]; else sub+=pr*cart[id]; }
  const off = DESC_EFECTIVO>0 ? Math.round(sub*DESC_EFECTIVO/100) : 0;
  return {sub, sin, off, cash: sub-off};
}
function totals(c){
  let h="";
  if(c.sub) h+=`<div class="tot"><span>Total</span><b>${fmt(c.sub)}</b></div>`;
  /*if(c.sub && c.off) h+=`<div class="tot cash"><span>Pagando en efectivo (${DESC_EFECTIVO}% OFF)</span><b>${fmt(c.cash)}</b></div>`;*/
  if(c.sin) h+=`<div class="note">${c.sin} producto${c.sin>1?"s":""} sin precio cargado: te lo confirmo por WhatsApp.</div>`;
  return h;
}
function payLine(){
  const c=calc(); if(pago==null||!c.sub) return "";
  const cash=PAGOS[pago].desc && c.off>0;
  return `<div class="tot"><span>Total a pagar</span><b>${fmt(cash?c.cash:c.sub)}</b></div>`+(cash?`<div class="note">Incluye ${DESC_EFECTIVO}% de descuento (ahorrás ${fmt(c.off)}).</div>`:"")+(c.sin?`<div class="note">Sin contar ${c.sin} producto${c.sin>1?"s":""} sin precio.</div>`:"");
}
function senaMonto(){
  const c=calc(); if(!c.sub||pago==null) return 0;
  const base=(PAGOS[pago].desc&&c.off>0)?c.cash:c.sub;
  return Math.round(base*SENA_PCT/100);
}
function senaBox(){
  if(!(SENA_PCT>0)) return ""; const m=senaMonto();
  return `<div class="sena"><b>✦ Seña obligatoria del ${SENA_PCT}% ✦</b><span>Para reservar tu pedido es necesario señar el ${SENA_PCT}% del total.</span>${m?`<div class="tot"><span>Seña a abonar</span><b style="display:inline;margin:0;font:600 15px Montserrat,sans-serif;letter-spacing:0">${fmt(m)}</b></div>`:""}</div>`;
}
function senaMsg(){
  if(!(SENA_PCT>0)) return ""; const m=senaMonto();
  return ` Voy a abonar la seña del ${SENA_PCT}%`+(m?` (${fmt(m)})`:"")+" para reservar.";
}
function totalMsg(){
  const c=calc(); if(!c.sub) return "";
  const cash=PAGOS[pago].desc && c.off>0;
  /*return (cash?` Total: ${fmt(c.cash)} (con ${DESC_EFECTIVO}% de descuento por pagar en efectivo).`:` Total: ${fmt(c.sub)}.`)+(c.sin?" Faltan confirmar los productos sin precio.":"");*/
}
function open_(s){ step=s; $("#ov").classList.add("on"); modal(); }
function close_(){ $("#ov").classList.remove("on"); }
function head(t){ return `<button class="x" onclick="close_()">×</button><h2 class="serif">${t}</h2><div class="steps">Paso ${step+1} de 3</div>`; }
function modal(){
  const ids=Object.keys(cart), sh=$("#sh"); let h="";
  if(!ids.length){ sh.innerHTML=`<button class="x" onclick="close_()">×</button><h2>Mi carrito</h2><div class="empty">Todavía no agregaste nada ✦</div>`; return; }
  if(step===0){
    const c=calc();
    h=head("Confirmá tu compra")+ids.map(id=>{const p=byId(id);return `<div class="it"><img src="${IMG[id]}"><div>${p.n}<br><span class="pr">${PR(p)!=null?fmt(PR(p)):"Consultar precio"}</span></div><div class="qty"><button onclick="setQ('${id}',-1)">−</button><span>${cart[id]}</span><button onclick="setQ('${id}',1)" ${cart[id]>=p.s?"disabled":""}>+</button></div></div>`}).join("")
    +totals(c)+senaBox()
    +`<div class="row"><button class="btn o" onclick="close_()">Seguir mirando</button><button class="btn" onclick="open_(1)">Confirmar</button></div>`;
  } else if(step===1){
    h=head("¿Con qué vas a pagar?")+PAGOS.map((o,i)=>`<label class="opt ${pago===i?"on":""}" onclick="pago=${i};modal()">${o.n}${o.desc&&DESC_EFECTIVO>0?`<span class="badge">${DESC_EFECTIVO}% OFF</span>`:""}</label>`).join("")
    +payLine()+senaBox()
    +`<div class="row"><button class="btn o" onclick="open_(0)">Volver</button><button class="btn" ${pago==null?"disabled":""} onclick="open_(2)">Siguiente</button></div>`;
  } else {
    const e=ENTREGAS[ent];
    h=head("¿Cómo lo querés recibir?")+ENTREGAS.map((o,i)=>`<label class="opt ${ent===i?"on":""}" onclick="direccion=($('#dirin')||{}).value||direccion;ent=${i};modal()">${o.n}</label>`).join("")
    +(e&&e.pide?`<label class="l">${e.pide}</label><input type="text" id="dirin" placeholder="Calle, número, piso/depto y localidad" value="${direccion.replace(/"/g,"&quot;")}" oninput="direccion=this.value;refreshMsg()">`:"")
    +(e&&e.pide&&ENVIO_NOTA?`<div class="sena" style="margin-top:14px"><b>✦ El envío no está incluido en el precio ✦</b><span>${ENVIO_NOTA}</span></div>`:"")
    +`<label class="l">Tu nombre</label><input type="text" id="nomin" placeholder="Nombre y apellido" value="${nombreCliente.replace(/"/g,"&quot;")}" oninput="nombreCliente=this.value;refreshMsg()">`
    +senaBox()+(ent!=null?`<div class="msg">${esc(msg())}</div>`:"")
    +`<div class="row"><button class="btn o" onclick="open_(1)">Volver</button><button class="btn" id="sendb" ${canSend()?"":"disabled"} onclick="send()">Enviar por WhatsApp</button></div>`;
  }
  sh.innerHTML=h;
}
const esc = s => s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function msg(){
  const its=Object.keys(cart).map(id=>{const p=byId(id);return p.n+(cart[id]>1?` (x${cart[id]})`:"")});
  const lista = its.length>1 ? its.slice(0,-1).join(", ")+" y "+its.slice(-1) : its[0];
  const e=ENTREGAS[ent];
  return `Hola, mi nombre es ${nombreCliente.trim()||"..."}, quiero comprar ${lista}.`+totalMsg()+` ${PAGOS[pago].msg[0].toUpperCase()+PAGOS[pago].msg.slice(1)}.`+senaMsg()+` ${e.msg}.`+(e.pide&&ENVIO_NOTA?" Entiendo que el envío no está incluido en el precio.":"")+(e.pide&&direccion.trim()?` ${e.pide}: ${direccion.trim()}.`:"");
}
const canSend=()=>{ const e=ENTREGAS[ent]; return ent!=null && !!nombreCliente.trim() && !(e&&e.pide&&!direccion.trim()); };
function refreshMsg(){ const m=$(".msg"); if(m) m.textContent=msg(); const b=$("#sendb"); if(b) b.disabled=!canSend(); }
function send(){
  if(!canSend()) return;
  const bad=Object.keys(cart).find(id=>cart[id]>byId(id).s);
  if(bad){ alert("Se agotó stock de: "+byId(bad).n); return; }
  const a=document.createElement("a"); a.href=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg())}`; a.target="_blank"; a.rel="noopener"; a.click();
}
/* ---- ficha de producto ---- */
let pid=null, gi=0;
const fotosDe=p=>[IMG[p.id],...(p.fotos||[])];
function openP(id){ pid=id; gi=0; $("#pv").classList.add("on"); renderP(); const s=$("#pd"); if(s) s.scrollTop=0; }
function closeP(){ $("#pv").classList.remove("on"); pid=null; }
function gP(d){ const n=fotosDe(byId(pid)).length; gi=(gi+d+n)%n; renderP(); }
function sP(i){ gi=i; renderP(); }
function renderP(){
  const p=byId(pid); if(!p) return;
  const fs=fotosDe(p), q=cart[p.id]||0, out=p.s<=0, c=CATS.find(x=>x.k===p.cat)||{}, pr=PR(p), many=fs.length>1;
  const det=[["Categoría",c.t||""]];
  if(c.d) det.push(["Detalle",c.d[0].toUpperCase()+c.d.slice(1)]);
  if(p.med) det.push(["Medidas",p.med]);
  det.push(["Disponibilidad",out?"Agotado":p.s===1?"Última unidad":p.s+" unidades"]);
  const act = out ? `<button class="btn" disabled>Agotado</button>`
    : q ? `<div class="qty" style="flex:1"><button onclick="setQ('${p.id}',-1)">−</button><span>${q}</span><button onclick="setQ('${p.id}',1)" ${q>=p.s?"disabled":""}>+</button></div><button class="btn" style="flex:1" onclick="closeP();open_(0)">Ver mi carrito</button>`
    : `<button class="btn" onclick="setQ('${p.id}',1)">Agregar al carrito</button>`;
  $("#pd").innerHTML=`<button class="pdx" onclick="closeP()" aria-label="Cerrar">×</button>
  <div class="pg"><img id="pgm" class="mn" src="${fs[gi]}" alt="${esc(p.n)}">
  ${many?`<div class="cn2">${gi+1} / ${fs.length}</div><button class="nv l" onclick="gP(-1)" aria-label="Foto anterior">‹</button><button class="nv r" onclick="gP(1)" aria-label="Foto siguiente">›</button>
  <div class="th">${fs.map((f,i)=>`<button class="tb ${i===gi?"on":""}" onclick="sP(${i})"><img src="${f}" alt=""></button>`).join("")}</div>`:""}</div>
  <div class="pi"><h2 class="serif">${esc(p.n)}</h2><div class="pp">${pr!=null?fmt(pr):"Consultar precio"}</div>
  ${p.desc?`<p class="dsc">${esc(p.desc)}</p>`:""}
  <div class="dt">${det.map(([a,b])=>`<div><span>${a}</span><b>${esc(b)}</b></div>`).join("")}</div>
  <div class="row">${act}</div>
  <a class="mas" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent("Hola, quiero ver más fotos de: "+p.n)}">¿Querés ver más fotos? Escribime por WhatsApp</a></div>`;
  const m=$("#pgm"); let x0=null;
  m.ontouchstart=e=>{x0=e.touches[0].clientX}; m.ontouchend=e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; x0=null; if(many&&Math.abs(dx)>40) gP(dx<0?1:-1); };
}
$("#pv").onclick=e=>{ if(e.target.id==="pv") closeP(); };
addEventListener("keydown",e=>{ if(!pid) return; if(e.key==="Escape") closeP(); else if(e.key==="ArrowLeft") gP(-1); else if(e.key==="ArrowRight") gP(1); });
$("#fab").onclick=()=>open_(0);
$("#ov").onclick=e=>{ if(e.target.id==="ov") close_(); };
Object.keys(cart).forEach(id=>{ const p=byId(id); if(!p||p.off||p.s<=0) delete cart[id]; else cart[id]=Math.min(cart[id],p.s); });
 
/* ---- efectos ---- */
let lastCat=null;
const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.08}):null;
function fx(){
  $("#fab").classList.toggle("has",count()>0);
  const same=lastCat===cat; lastCat=cat;
  if(same||!io) return;
  document.querySelectorAll(".hero,.tile,.paso,.punto,.sec,.card,.fin").forEach(el=>{el.classList.add("rv");io.observe(el);});
}
(function(){
  const k=matchMedia("(prefers-reduced-motion: reduce)").matches?.4:1;
  const c=$("#dust"),x=c.getContext("2d"); let W,H;
  const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight}; rs(); addEventListener("resize",rs);
  const P=Array.from({length:Math.min(75,Math.round(innerWidth/16))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2+.9,s:Math.random()*.28+.06,a:Math.random()*6.28,t:Math.random()*.02+.006}));
  (function f(){
    x.clearRect(0,0,W,H); x.shadowColor="rgba(214,178,108,.9)"; x.shadowBlur=12;
    for(const p of P){ p.y-=p.s*k; p.x+=Math.sin(p.a+=p.t*k)*.35*k; if(p.y<-6){p.y=H+6;p.x=Math.random()*W}
      x.fillStyle="rgba(214,178,108,"+Math.max(.15,.55+.4*Math.sin(p.a*2))+")"; x.beginPath(); x.arc(p.x,p.y,p.r,0,6.283); x.fill(); }
    requestAnimationFrame(f);
  })();
})();
document.querySelectorAll("[data-d]").forEach(e=>e.src=D[e.dataset.d]||"");
{const l=document.createElement("link");l.rel="icon";l.href=D.fav||"";document.head.appendChild(l);}
$("#fwa").href="https://wa.me/"+WHATSAPP;
/* ---- cursor personalizado (solo con mouse) ---- */
(function(){
  if(!matchMedia("(hover:hover) and (pointer:fine)").matches) return;
  const rm=matchMedia("(prefers-reduced-motion: reduce)").matches, R=document.documentElement;
  const s=document.createElement("div"), r=document.createElement("div");
  s.id="cs"; r.id="cr"; s.innerHTML='<b><img src="'+(D.sol||"")+'" alt=""></b>'; document.body.append(r,s);
  let mx=0,my=0,rx=0,ry=0,ready=false,last=0;
  const spark=(x,y,dx,dy)=>{ const p=document.createElement("i"); p.className="sp"; p.style.cssText="left:"+x+"px;top:"+y+"px;--dx:"+dx+"px;--dy:"+dy+"px"; document.body.appendChild(p); p.addEventListener("animationend",()=>p.remove()); };
  addEventListener("mousemove",e=>{
    mx=e.clientX; my=e.clientY; if(!ready){ready=true;rx=mx;ry=my;R.classList.add("hc");}
    s.style.transform="translate("+mx+"px,"+my+"px)";
    R.classList.toggle("hc-hover",!!e.target.closest("a,button,.card,.tile,.opt,.chip,label"));
    R.classList.toggle("hc-dark",!!e.target.closest(".btn:not(.o):not(:disabled),.fab,.chip.on"));
    R.classList.toggle("hc-text",!!e.target.closest("input,textarea"));
    const t=performance.now(); if(!rm&&t-last>45){ last=t; spark(mx,my,Math.random()*24-12,-10-Math.random()*14); }
  });
  addEventListener("mousedown",()=>{ R.classList.add("hc-down"); if(!rm) for(let i=0;i<8;i++) spark(mx,my,Math.random()*70-35,Math.random()*70-35); });
  addEventListener("mouseup",()=>R.classList.remove("hc-down"));
  document.addEventListener("mouseleave",()=>R.classList.remove("hc"));
  document.addEventListener("mouseenter",()=>{ if(ready) R.classList.add("hc"); });
  (function f(){ rx+=(mx-rx)*.16; ry+=(my-ry)*.16; r.style.transform="translate("+rx+"px,"+ry+"px)"; requestAnimationFrame(f); })();
})();
draw();
</script>
